[Rainmeter]
Update=100
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=MinimalLyrics
Author=lyricsh
Version=1.1.0
License=MIT
Information=Minimalist synchronized LRC lyrics for Apple Music (WebNowPlaying + LRCLIB auto-fetch)

[MeasureTitle]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Title
RegExpSubstitute=1
Substitute="(?i)\s*\(.*?\)":"","(?i)\s*\[.*?\]":"","(?i)\s*feat\b\.?\s*.*$":"","(?i)\s*ft\b\.?\s*.*$":"","(?i)\s*remix\b.*$":"","(?i)\s*-\s*(?:single|ep|album)\s*$":"","\s\s+":" ","^\s+":"","\s+$":""

[MeasureArtist]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Artist
RegExpSubstitute=1
Substitute="(?i)\s*\(.*?\)":"","(?i)\s*\[.*?\]":"","(?i)\s*feat\b\.?\s*.*$":"","(?i)\s*ft\b\.?\s*.*$":"","(?i)\s*remix\b.*$":"","(?i)\s*-\s*(?:single|ep|album)\s*$":"","\s\s+":" ","^\s+":"","\s+$":""

[MeasurePosition]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Position

[MeasureState]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=State

[MeasureDuration]
Measure=Plugin
Plugin=WebNowPlaying
PlayerType=Duration

[MeasureFetch]
Measure=Plugin
Plugin=RunCommand
Program=curl.exe
Parameter=-s -A MinimalLyrics/1.0 --max-time 8
State=Hide
Timeout=12000
OutputType=UTF8
OutputFile=#@#Scripts\FetchResult_0.json

[MeasureLyrics]
Measure=Script
ScriptFile=#@#Scripts\Lyrics.lua
UpdateDivider=1

[MeterPrev]
Meter=String
X=0
Y=0
W=480
ClipString=2
AntiAlias=1
FontFace=Segoe UI
FontSize=13
FontWeight=400
FontColor=20,20,20,130
Text=

[MeterCurrent]
Meter=String
X=0
Y=10R
W=480
ClipString=2
AntiAlias=1
FontFace=Segoe UI
FontSize=18
FontWeight=700
FontColor=20,20,20,240
Text=

[MeterNext]
Meter=String
X=0
Y=10R
W=480
ClipString=2
AntiAlias=1
FontFace=Segoe UI
FontSize=13
FontWeight=400
FontColor=20,20,20,130
Text=
