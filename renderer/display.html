<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LyricSh Display</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', -apple-system, sans-serif;
  }

  .lyrics-container {
    text-align: center;
    max-width: 80vw;
    user-select: none;
  }

  .prev-line {
    font-size: 2.5vh;
    color: rgba(255, 255, 255, 0.25);
    margin-bottom: 2vh;
    transition: opacity 0.6s ease;
    min-height: 3vh;
  }

  .current-line {
    font-size: 6vh;
    font-weight: 600;
    color: #fff;
    margin-bottom: 2vh;
    transition: opacity 0.4s ease, transform 0.4s ease;
    min-height: 7vh;
    line-height: 1.3;
    text-shadow: 0 0 40px rgba(255, 255, 255, 0.15);
  }

  .next-line {
    font-size: 2.5vh;
    color: rgba(255, 255, 255, 0.25);
    margin-top: 2vh;
    transition: opacity 0.6s ease;
    min-height: 3vh;
  }

  .status-line {
    position: fixed;
    bottom: 2vh;
    left: 50%;
    transform: translateX(-50%);
    font-size: 1.5vh;
    color: rgba(255, 255, 255, 0.08);
    letter-spacing: 0.1em;
  }

  .fade-in { opacity: 1; }
  .fade-out { opacity: 0; }
</style>
</head>
<body>
  <div class="lyrics-container">
    <div class="prev-line" id="prev"></div>
    <div class="current-line" id="current"></div>
    <div class="next-line" id="next"></div>
  </div>
  <div class="status-line" id="status">waiting...</div>

<script>
  const prevEl = document.getElementById('prev');
  const currentEl = document.getElementById('current');
  const nextEl = document.getElementById('next');
  const statusEl = document.getElementById('status');

  let ws = null;
  let reconnectTimer = null;

  function connect() {
    ws = new WebSocket('ws://localhost:5006');

    ws.onopen = () => {
      statusEl.textContent = 'connected';
    };

    ws.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        updateDisplay(data);
      } catch (e) {
        console.error('Parse error:', e);
      }
    };

    ws.onclose = () => {
      statusEl.textContent = 'reconnecting...';
      reconnectTimer = setTimeout(connect, 2000);
    };

    ws.onerror = () => {
      statusEl.textContent = 'error';
    };
  }

  function fadeUpdate(el, text) {
    if (el.textContent === text) return;
    el.classList.add('fade-out');
    setTimeout(() => {
      el.textContent = text;
      el.classList.remove('fade-out');
      el.classList.add('fade-in');
      setTimeout(() => el.classList.remove('fade-in'), 400);
    }, 300);
  }

  function updateDisplay(data) {
    fadeUpdate(prevEl, data.prev || '');
    fadeUpdate(currentEl, data.current || '');
    fadeUpdate(nextEl, data.next || '');

    if (data.state === 0) {
      statusEl.textContent = (data.artist || '') + ' - ' + (data.title || '') + ' (paused)';
    } else {
      statusEl.textContent = (data.artist || '') + ' - ' + (data.title || '');
    }
  }

  connect();
</script>
</body>
</html>
